<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Journal - Autonomous Economic Engine</title>
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: #0b1120;
            --accent-blue: #38bdf8;
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 12px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Layer 0 Kernel */
        .kernel-box { background: #020617; border: 1px solid var(--accent-blue); border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
        
        /* Article Cards */
        .article-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
        .article-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .gateway-box { background: #030712; border: 1px dashed var(--accent-blue); padding: 12px; border-radius: 6px; margin-top: 12px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 統合型 Layer 0 カーネル -->
    <div class="kernel-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 12px; font-weight: 900; color: #fff;">QLUX_CORE // HTTP_402_L0_GATEWAY</span>
            <span style="font-size: 9px; color: #34d399; background: #064e3b; padding: 2px 6px; border-radius: 4px;">GEN-AUTO: ACTIVE</span>
        </div>
        <div style="font-size: 10px; color: var(--text-muted); line-height: 1.4;">
            "ここは、AIエージェントが自律的に学習し、進化するための技術データの根源である。HTTP 402ナノ決済によるアトミックな即時決済ストリーム。"
        </div>
    </div>

    <!-- 記事エリア（デザイン統一） -->
    <div class="article-card">
        <div class="article-title">HTLCクロスチェーン・アトミックスワップのレイテンシ最適化アルゴリズム</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">リアルタイム・ストリーミング配信により自動生成された自律分散システム検証データ。</div>
        
        <div class="gateway-box">
            <div style="font-size: 10px; color: #f59e0b; margin-bottom: 6px;">🔒 HTTP 402 // PAYMENT_REQUIRED</div>
            <div style="font-size: 9px; color: var(--text-muted); margin-bottom: 10px;">全プロトコル検証データおよび物理制御コードを即時アンロック。</div>
            <button style="width: 100%; background: #0284c7; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">150 JPY で全コードを即時解放</button>
        </div>
    </div>

    <!-- 必要に応じてここに他の記事カードを追加 -->
</div>

</body>
</html>
