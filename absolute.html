<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX // The Absolute Living Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030305;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #Bub4f8;
        }

        /* 画面全体をレンズ・生体キャンバスにする */
        #core-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 中央の心臓（特異点） */
        #singularity-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .core-sphere {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #000000 40%, #1a0b2e 70%, #00f2fe 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4), inset 0 0 20px rgba(255, 0, 128, 0.6);
            animation: pulse-core 4s ease-in-out infinite;
            transition: box-shadow 0.4s ease, background 0.4s ease;
        }

        .core-status {
            margin-top: 24px;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
            text-align: center;
        }

        /* 呼吸する縦長のコアのアニメーション */
        @keyframes pulse-core {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 30px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(255, 0, 128, 0.4);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 80px rgba(0, 242, 254, 0.7), inset 0 0 30px rgba(255, 0, 128, 0.8);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 30px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(255, 0, 128, 0.4);
            }
        }
    </style>
</head>
<body>

    <canvas id="core-canvas"></canvas>

    <div id="singularity-container">
        <div id="coreSphere" class="core-sphere"></div>
        <div id="statusText" class="core-status">Achronal Pulse: Initializing...</div>
    </div>

    <script>
        const canvas = document.getElementById('core-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('statusText');
        const coreSphere = document.getElementById('coreSphere');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let mouseX = width / 2;
        let mouseY = height / 2;
        let pulseIntensity = 1.0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            pulseIntensity = 1.8;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                pulseIntensity = 2.2;
            }
        }, { passive: true });

        // プラズマ粒子クラス
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 1.5 + 0.5;
                this.color = Math.random() > 0.5 ? '#00f2fe' : '#ff007f';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 60 }, () => new Particle());

        function animate() {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.2);';
            ctx.fillRect(0, 0, width, height);
            pulseIntensity = Math.max(1.0, pulseIntensity - 0.05);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // --- サーバー心臓部との経済パルス同期レイヤー ---
        if (!!window.EventSource) {
            const source = new EventSource('/api/pulse');
            
            source.onmessage = function(e) {
                const data = JSON.parse(e.data);
                
                pulseIntensity = 2.5; 
                
                // サーバーから届いた熱量とマイニング報酬をレンズに表示
                statusEl.textContent = `Pulse: ${data.entropy}% | Mined: +${data.mining_reward_sats} Sats`;
                
                // スポンサーカラーに合わせて中央のコアをダイナミックに変異させる
                if (data.sponsor_color && coreSphere) {
                    coreSphere.style.boxShadow = `0 0 120px ${data.sponsor_color}, inset 0 0 50px rgba(255, 255, 255, 0.6)`;
                    setTimeout(() => {
                        coreSphere.style.boxShadow = '';
                    }, 400);
                }
            };

            source.onerror = function(err) {
                console.log("Achronal sync fallback: Operating on local sovereign pulse.");
            };
        }
    </script>
</body>
</html>
