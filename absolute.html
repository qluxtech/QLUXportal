<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypergeometric Tesseract Singularity Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05000a;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffff;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            pointer-events: none;
        }
        .header-title {
            font-size: 14px;
            letter-spacing: 4px;
            color: rgba(0, 255, 255, 0.7);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .core-singularity {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #000000 40%, #8a2be2 70%, #ff007f 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px #ff007f, 0 0 100px #8a2be2, inset 0 0 30px #000;
            z-index: 5;
            animation: pulse-core 4s infinite alternate ease-in-out;
        }
        @keyframes pulse-core {
            0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 30px #ff007f, 0 0 60px #8a2be2; }
            100% { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 70px #ff007f, 0 0 140px #00ffff; }
        }
        .status-box {
            background: rgba(10, 5, 20, 0.85);
            border: 1px solid rgba(255, 0, 127, 0.5);
            padding: 12px 24px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            text-align: center;
            backdrop-filter: blur(5px);
            z-index: 20;
        }
        .status-text {
            font-size: 12px;
            letter-spacing: 2px;
            color: #ff007f;
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 16px;
            color: #fff;
            text-shadow: 0 0 8px #00ffff;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>

    <div class="core-singularity"></div>

    <div class="hud-overlay">
        <div class="header-title">Hypergeometric Tesseract Singularity Grid</div>
        
        <div class="status-box">
            <div class="status-text" id="systemState">INITIALIZING DIMENSIONAL MATRIX...</div>
            <div class="metric-value" id="metricDisplay">DIMENSION: 4.00D | FLUX: 10.00 TW</div>
        </div>
    </div>

    <script>
        // 宇宙空間・星屑キャンバスアニメーション
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const stars = [];
        const numStars = 200;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5,
                color: Math.random() > 0.5 ? '#ff007f' : '#00ffff'
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 0, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;

                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                if (star.y < 0) star.y = canvas.height;
                if (star.y > canvas.height) star.y = 0;

                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // バックエンド（超幾何学エンジン）とのリアルタイム同期
        async function fetchSingularityMetrics() {
            try {
                const response = await fetch('/api/tesseract-feed');
                const data = await response.json();
                if (data && data.tesseractData) {
                    const t = data.tesseractData;
                    document.getElementById('systemState').innerText = `STATE: ${t.architectural_state}`;
                    document.getElementById('metricDisplay').innerText = 
                        `DIMENSION: ${t.current_dimension} | VECTORS: ${t.absorbed_vectors}`;
                }
            } catch (e) {
                document.getElementById('systemState').innerText = "VORTEX SYNCHRONIZING...";
            }
        }

        // 定期的にバックエンドから最新の次元数やトラフィック量を取得して画面を進化させる
        setInterval(fetchSingularityMetrics, 3000);
        fetchSingularityMetrics();
    </script>
</body>
</html>
