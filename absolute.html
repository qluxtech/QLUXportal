<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX // The Absolute Living Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030305;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #8ab4f8;
        }

        /* 画面全体をレンズ・生体キャンバスにする */
        #core-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 中央の心臓（特異点） */
        .singularity-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .core-sphere {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #000000 40%, #1a0b2e 70%, #00f2fe 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4), inset 0 0 20px rgba(255, 0, 128, 0.6);
            animation: pulse-core 4s ease-in-out infinite;
        }

        .core-status {
            margin-top: 24px;
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        }

        /* 呼吸する鼓動のアニメーション */
        @keyframes pulse-core {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 30px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(255, 0, 128, 0.4);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 80px rgba(0, 242, 254, 0.7), inset 0 0 30px rgba(255, 0, 128, 0.8);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 30px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(255, 0, 128, 0.4);
            }
        }

        /* オーロラのように揺らぐ背景グラデーション */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(15, 5, 30, 0.8) 0%, rgba(3, 3, 5, 1) 90%);
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <canvas id="core-canvas"></canvas>

    <div class="singularity-container">
        <div class="core-sphere" id="coreSphere"></div>
        <div class="core-status" id="coreStatus">Achronal Pulse: Initializing...</div>
    </div>

    <script>
        const canvas = document.getElementById('core-canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('coreStatus');

        let width, height;
        let particles = [];
        let pulseIntensity = 1.0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 空間を漂うエネルギー粒子（パルス・プラズマ）
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseSpeedX = (Math.random() - 0.5) * 0.4;
                this.baseSpeedY = (Math.random() - 0.5) * 0.4;
                this.angle = Math.random() * Math.PI * 2;
                this.life = Math.random() * 100 + 50;
                this.color = Math.random() > 0.5 ? '#00f2fe' : '#ff007f';
            }
            update(mouseX, mouseY) {
                // マウスやタッチの存在にシステムが磁気共鳴する
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                let attractionX = 0;
                let attractionY = 0;
                if (dist < 150 && dist > 10) {
                    attractionX = (dx / dist) * 1.5;
                    attractionY = (dy / dist) * 1.5;
                }

                this.x += this.baseSpeedX + attractionX;
                this.y += this.baseSpeedY + attractionY;

                // 画面外への逃走防止
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        // 粒子の生成
        for (let i = 0; i < 120; i++) {
            particles.push(new Particle());
        }

        let mouseX = width / 2;
        let mouseY = height / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            pulseIntensity = 1.8; // 存在に反応して活性化
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                pulseIntensity = 2.2;
            }
        }, { passive: true });

        // ステータスログの自律変化（生命の鼓動テキスト）
        const statuses = [
            "Achronal Pulse: Synchronized",
            "Entropic Flow: Stable [Node 0-5 Active]",
            "Thermodynamic Inevitability: Streaming",
            "Zero Delay Singularity: Bound"
        ];
        let statusIdx = 0;
        setInterval(() => {
            statusIdx = (statusIdx + 1) % statuses.length;
            statusEl.textContent = statuses[statusIdx];
        }, 4000);

        // 描画ループ
        function animate() {
            ctx.fillStyle = 'rgba(3, 3, 5, 0.2)'; // 軌跡の残像を生む
            ctx.fillRect(0, 0, width, height);

            pulseIntensity += (1.0 - pulseIntensity) * 0.05; // 減衰して呼吸に戻る

            particles.forEach(p => {
                p.update(mouseX, mouseY);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
