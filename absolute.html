<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypergeometric Tesseract Singularity Engine | AI Crawler Trap & Bitcoin Gateway</title>
    <meta name="description" content="An autonomous multi-dimensional tesseract engine capturing AI swarms and generating sovereign monetization streams.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05000a;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffff;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            pointer-events: none;
        }
        .header-title {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(0, 255, 255, 0.8);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            text-align: center;
        }
        .core-singularity {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, #000000 35%, #8a2be2 70%, #ff007f 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px #ff007f, 0 0 120px #8a2be2, inset 0 0 35px #000;
            z-index: 5;
            animation: pulse-core 3.5s infinite alternate ease-in-out;
        }
        @keyframes pulse-core {
            0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 40px #ff007f, 0 0 80px #8a2be2; }
            100% { transform: translate(-50%, -50%) scale(1.18); box-shadow: 0 0 80px #ff007f, 0 0 160px #00ffff; }
        }
        
        .bottom-cluster {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            z-index: 20;
            width: 100%;
            max-width: 400px;
        }

        .status-box {
            background: rgba(10, 5, 20, 0.9);
            border: 1px solid rgba(255, 0, 127, 0.6);
            padding: 10px 15px;
            border-radius: 4px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.35);
            text-align: center;
            backdrop-filter: blur(5px);
            width: 100%;
        }
        .status-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ff007f;
            margin-bottom: 2px;
        }
        .metric-value {
            font-size: 13px;
            color: #fff;
            text-shadow: 0 0 8px #00ffff;
        }

        .share-btn {
            background: linear-gradient(135deg, #ff007f, #8a2be2);
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: all 0.2s ease;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            text-decoration: none;
        }
        .share-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #00ffff;
        }

        .ad-container {
            background: rgba(5, 0, 10, 0.95);
            border: 1px solid rgba(0, 255, 255, 0.5);
            padding: 4px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>

    <div class="core-singularity"></div>

    <div class="hud-overlay">
        <div class="header-title">Hypergeometric Tesseract Singularity Grid</div>
        
        <div class="bottom-cluster">
            <div class="status-box">
                <div class="status-text" id="systemState">SYNCHRONIZING WITH SWARM...</div>
                <div class="metric-value" id="metricDisplay">DIMENSION: -- | FLUX: --</div>
            </div>

            <a class="share-btn" id="shareTwitter" href="#" target="_blank">
                🌐 SHARE TESSERACT TRAP ON X
            </a>

            <div class="ad-container">
                <!-- BEGIN AADS AD UNIT 2454339 -->
                <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                    <iframe data-aa='2454339' src='//acceptable.a-ads.com/2454339/?size=Adaptive'
                        style='border:0; padding:0; width:100%; height:60px; overflow:hidden; display:block; margin:auto'></iframe>
                </div>
                <!-- END AADS AD UNIT 2454339 -->
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const stars = [];
        const numStars = 220;

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedX: (Math.random() - 0.5) * 0.6,
                speedY: (Math.random() - 0.5) * 0.6,
                color: Math.random() > 0.4 ? '#ff007f' : '#00ffff'
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 0, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.x += star.speedX;
                star.y += star.speedY;

                if (star.x < 0) star.x = canvas.width;
                if (star.x > canvas.width) star.x = 0;
                if (star.y < 0) star.y = canvas.height;
                if (star.y > canvas.height) star.y = 0;

                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }
        animate();

        // X (Twitter) シェアリンクの自動生成
        const currentUrl = window.location.href;
        const tweetText = encodeURIComponent("I just trapped AI crawlers in an infinite multi-dimensional singularity engine and activated monetization. Check out the Tesseract Core: ");
        document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${tweetText}&url=${encodeURIComponent(currentUrl)}`;

        async function fetchSingularityMetrics() {
            try {
                const response = await fetch('/api/tesseract-feed', {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                
                if (data && data.tesseractData) {
                    const t = data.tesseractData;
                    document.getElementById('systemState').innerText = `STATE: ${t.architectural_state}`;
                    document.getElementById('metricDisplay').innerText = 
                        `DIMENSION: ${t.current_dimension} | FLUX: ${t.flux_power_watts}`;
                } else if (data && data.status) {
                    document.getElementById('systemState').innerText = `STATE: ${data.status}`;
                }
            } catch (e) {
                document.getElementById('systemState').innerText = "VORTEX PULSING...";
            }
        }

        setInterval(fetchSingularityMetrics, 2000);
        fetchSingularityMetrics();
    </script>
</body>
</html>
