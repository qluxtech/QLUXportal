name: Auto Blog Generator

on:
  schedule:
    - cron: '0 0 * * *' # 毎日深夜0時（UTC）に自動実行
  workflow_dispatch: # 手動での即時実行も可能

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Blog Engine
        run: python qlux_apex_blog_engine.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate blog post [skip ci]" && git push)
