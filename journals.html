<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Journals // Planetary Sovereign Mesh</title>
    <style>
        :root {
            --bg-color: #020403;
            --card-bg: #060a08;
            --border-color: #112217;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --text-main: #f4f4f1;
            --text-muted: #6b7280;
            --badge-bg: #04140c;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(2, 4, 3, 0.9);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); }
        .planetary-badge {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .active-settle-badge {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .nav-btn:hover { border-color: var(--accent-cyan); color: var(--text-main); }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 50px 20px; }
        .section-tag { font-size: 0.7rem; color: var(--accent-cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        h1 { font-size: 2.5rem; margin: 0 0 10px 0; font-weight: 800; letter-spacing: -1px; color: #fff; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; line-height: 1.6; }

        .journals-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) {
            .journals-grid { grid-template-columns: repeat(2, 1fr); }
            .post-card.wide { grid-column: span 2; }
        }

        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .post-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.05);
            transform: translateY(-2px);
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.68rem; color: var(--text-muted); margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 1px; font-family: monospace;
        }
        .badge {
            background: var(--badge-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
            padding: 3px 8px; border-radius: 4px;
            font-size: 0.6rem; letter-spacing: 1px; font-family: monospace;
        }
        .badge.free { border-color: var(--border-color); color: var(--text-muted); }
        .post-title { color: var(--text-main); font-size: 1.25rem; margin: 0 0 10px 0; font-weight: 700; line-height: 1.4; }
        .post-excerpt { color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; margin-bottom: 20px; }
        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: auto;
        }
        .fee-info { color: var(--text-muted); font-family: monospace; font-size: 0.75rem; }
        .action-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff; border: none; padding: 8px 16px; border-radius: 6px;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; cursor: pointer;
        }
        .action-btn:hover { opacity: 0.9; }
        .action-btn.free-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

        /* モーダル */
        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 3, 0.85); justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; z-index: 1000; backdrop-filter: blur(8px);
        }
        .modal-content {
            background: var(--card-bg); border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px; max-width: 750px; width: 100%; padding: 35px;
            box-sizing: border-box; max-height: 85vh; overflow-y: auto; position: relative;
        }
        .close-btn { position: absolute; top: 20px; right: 25px; background: none; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; }
        .close-btn:hover { color: var(--text-main); }
        #modal-meta { font-size: 0.68rem; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-family: monospace; }
        #modal-title { color: var(--text-main); font-size: 1.5rem; margin: 0 0 15px 0; font-weight: 700; }
        .locked-box { border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin: 20px 0; background: #040806; }
        .locked-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.7rem; color: #f59e0b; font-family: monospace; }
        .terminal-log { background: #010302; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; }
        #modal-body { font-size: 0.95rem; color: var(--text-main); line-height: 1.8; white-space: pre-line; display: none; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="logo-area">
            <div class="logo">QLUX</div>
            <div class="planetary-badge">Planetary Sovereign</div>
        </div>
        <div class="header-right">
            <div class="active-settle-badge">⚡ HTTP 402 NANO-SETTLEMENT: ACTIVE</div>
            <div class="nav-links">
                <button class="nav-btn">Console</button>
                <button class="nav-btn">Access Protocol</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="section-tag">Research & Deep Insights</div>
        <h1>QLUX Journals</h1>
        <div class="subtitle">ここから先は、QLUXが定義する領域だ。QLUXは、すべての限界を過去にする。</div>
        
        <div id="posts-container" class="journals-grid"></div>
    </div>

    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-meta"></div>
            <h2 id="modal-title"></h2>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
            
            <div id="lock-section" class="locked-box" style="display:none;">
                <div class="locked-header">
                    <span>STATUS: 402 PAYMENT REQUIRED</span>
                    <span id="fee-badge">Fee: 0 Sats</span>
                </div>
                <div class="terminal-log" id="terminal-log">> Initializing HTTP 402 Handshake...</div>
                <button class="action-btn" id="pay-btn" onclick="executeNanoPayment()" style="width: 100%; padding: 12px;">⚡ Pay & Unlock</button>
            </div>

            <p id="modal-body"></p>
        </div>
    </div>

    <script>
        let currentJournalId = null;
        let currentFeeSats = 0;

        async function fetchJournals() {
            try {
                const res = await fetch('/api/journals');
                const posts = await res.json();
                renderGrid(posts);
            } catch (err) {
                console.error("Failed to load journals", err);
            }
        }

        function renderGrid(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            
            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = `post-card ${post.wide ? 'wide' : ''}`;
                card.onclick = () => openJournal(post.id);

                const isFree = post.access === 'free';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span>${post.date} // ${post.category}</span>
                            <span class="${isFree ? 'badge free' : 'badge'}">${isFree ? 'FREE ACCESS' : 'HTTP 402 ENABLED'}</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-excerpt">${post.excerpt}</p>
                    </div>
                    <div class="card-footer">
                        <span class="fee-info">${post.feeText}</span>
                        <button class="${isFree ? 'action-btn free-btn' : 'action-btn'}">${isFree ? 'Read Journal &rarr;' : '⚡ Pay & Unlock'}</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function openJournal(id) {
            currentJournalId = id;
            const log = document.getElementById('terminal-log');
            log.innerHTML = `> GET /api/journals/${id} HTTP/1.1<br>> Connecting to sovereign node...`;

            try {
                const res = await fetch(`/api/journals/${id}`);
                
                if (res.status === 402) {
                    const errorData = await res.json();
                    currentFeeSats = errorData.feeSats;
                    
                    document.getElementById('modal-meta').innerHTML = `402 GATEWAY // AUTH REQUIRED`;
                    document.getElementById('fee-badge').innerText = `Fee: ${currentFeeSats} Sats`;
                    log.innerHTML += `<br><span style="color: #f59e0b;">> Response: 402 Payment Required (${currentFeeSats} Sats)</span>`;
                    
                    document.getElementById('lock-section').style.display = 'block';
                    document.getElementById('modal-body').style.display = 'none';
                    document.getElementById('pay-btn').disabled = false;
                    document.getElementById('pay-btn').innerText = `⚡ Pay & Unlock`;
                    document.getElementById('modal-title').innerText = "Protected Sovereign Journal";
                } else if (res.ok) {
                    const data = await res.json();
                    document.getElementById('modal-meta').innerHTML = `${data.date} // ${data.category}`;
                    document.getElementById('modal-title').innerText = data.title;
                    document.getElementById('modal-body').innerText = data.content;
                    
                    document.getElementById('lock-section').style.display = 'none';
                    document.getElementById('modal-body').style.display = 'block';
                }

                document.getElementById('modal').style.display = 'flex';
                document.body.style.overflow = 'hidden';
            } catch (err) {
                console.error(err);
            }
        }

        async function executeNanoPayment() {
            const btn = document.getElementById('pay-btn');
            const log = document.getElementById('terminal-log');
            
            btn.innerText = '🔄 Settling Ledger...';
            btn.disabled = true;

            log.innerHTML += `<br>> POST /api/settle --amount=${currentFeeSats}sats`;

            try {
                const settleRes = await fetch('/api/settle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ journalId: currentJournalId, sats: currentFeeSats })
                });
                const settleData = await settleRes.json();

                log.innerHTML += `<br>> Ledger settled. Token acquired.`;
                log.innerHTML += `<br>> Retrying GET with Authorization & Proof headers...`;

                const res = await fetch(`/api/journals/${currentJournalId}`, {
                    headers: {
                        'Authorization': `Bearer ${settleData.clientToken}`,
                        'X-Nano-Payment-Proof': settleData.paymentProof
                    }
                });

                if (res.ok) {
                    const data = await res.json();
                    log.innerHTML += `<br><span style="color: #38bdf8;">> Response: HTTP/1.1 200 OK. Signature verified. Payload unlocked.</span>`;
                    
                    setTimeout(() => {
                        document.getElementById('modal-meta').innerHTML = `${data.date} // ${data.category}`;
                        document.getElementById('modal-title').innerText = data.title;
                        document.getElementById('modal-body').innerText = data.content;
                        document.getElementById('lock-section').style.display = 'none';
                        document.getElementById('modal-body').style.display = 'block';
                    }, 500);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }

        fetchJournals();
        setInterval(fetchJournals, 30000);
    </script>
</body>
</html>
