<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Journals // Sovereign Mesh</title>
    <style>
        :root {
            --bg-color: #030504;
            --card-bg: #080d0a;
            --border-color: #122218;
            --accent-green: #38bdf8;
            --text-main: #f4f4f1;
            --text-muted: #7a8c82;
            --badge-bg: #0c1a12;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .engine-status {
            background: #081510;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--accent-green);
            font-size: 0.7rem;
        }
        .section-tag {
            font-size: 0.75rem;
            color: var(--accent-green);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 35px;
        }
        
        /* 非対称レイアウトグリッド */
        .journals-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media(min-width: 768px) {
            .journals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .post-card.wide {
                grid-column: span 2;
            }
        }

        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .post-card:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
        }
        .badge.free {
            color: var(--text-muted);
        }
        .post-title {
            color: var(--text-main);
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            line-height: 1.4;
        }
        .post-excerpt {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 0.8rem;
            margin-top: auto;
        }
        .fee-info {
            color: var(--text-muted);
        }
        .action-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btn.free-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        /* モーダル */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 4, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            max-width: 750px;
            width: 100%;
            padding: 35px;
            box-sizing: border-box;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }
        #modal-meta {
            font-size: 0.75rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        #modal-title {
            color: var(--text-main);
            font-size: 1.6rem;
            margin: 0 0 15px 0;
        }
        .locked-box {
            border: 1px dashed var(--border-color);
            padding: 25px;
            text-align: center;
            border-radius: 6px;
            margin: 20px 0;
            background: #050a07;
        }
        .locked-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        #modal-body {
            font-size: 1rem;
            color: var(--text-main);
            line-height: 1.8;
            white-space: pre-line;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <span>QLUX // SOVEREIGN MESH</span>
            <span class="engine-status">⚡ HTTP 402 NANO-SETTLEMENT ENGINE: ACTIVE</span>
        </div>

        <div class="section-tag">Research & Deep Insights</div>
        <h1>QLUX Journals</h1>
        <div class="subtitle">ここから先は、QLUXが定義する領域だ。QLUXは、すべての限界を過去にする。</div>
        
        <div id="posts-container" class="journals-grid"></div>
    </div>

    <!-- モーダル -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-meta"></div>
            <h2 id="modal-title"></h2>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
            
            <!-- ロック状態エリア -->
            <div id="lock-section" class="locked-box">
                <div class="locked-text" id="locked-desc">このコンテンツの閲覧にはHTTP 402ナノペイメントが必要です。</div>
                <button class="action-btn" id="pay-btn" onclick="executePayment()">⚡ Pay & Unlock Journal</button>
            </div>

            <!-- アンロック後本文 -->
            <p id="modal-body"></p>
        </div>
    </div>

    <script>
        const allPosts = [
            {
                date: "2026.08.14",
                category: "RESEARCH • AI AGENT TRIBE",
                title: "自律型AIトライブ間におけるHTTP 402プロトコルの実戦的最最適化とナノペイメント実装",
                excerpt: "仲介者を完全に排除したマイクロエージェント間の即時決済モデル。数サトシ単位の価値流通がいかにしてネットワークのレジリエンスを極限まで高めるか、その暗号学的検証データとソースコードを公開。",
                content: "自律型AIトライブ間におけるHTTP 402プロトコルの実戦的最最適化とナノペイメント実装に関する詳細レポート。\n\n仲介者を完全に排除したマイクロエージェント間の即時決済モデルを構築。数サトシ単位の価値流通がいかにしてネットワークのレジリエンスを極限まで高めるかについて、暗号学的検証データと実際のソースコードを交えて徹底解説する。\n\n1. マイクロエージェント間ナノペイメントのアーキテクチャ\n2. HTTP 402ステータスコードを活用した自律プロトコル\n3. ゼロトラスト環境下における高速セットリングテスト結果",
                fee: "0.001 QLUX (Nano-Payment)",
                access: "paid",
                wide: true
            },
            {
                date: "2026.08.01",
                category: "ARCHITECTURE",
                title: "高密度物性コンパイルと熱共鳴制御の統合フェーズ",
                excerpt: "ハードウェアとソフトウェアの境界を溶解させる、次世代マテリアル・インフラストラクチャの設計思想。",
                content: "ハードウェアとソフトウェアの境界を完全に溶解させる次世代マテリアル・インフラストラクチャの設計思想について。\n\n高密度物性コンパイル技術により、物理的な制約をコードレベルで最適化し、熱共鳴制御を統合することで極限までの効率化を実現する。",
                fee: "Free Access",
                access: "free",
                wide: false
            },
            {
                date: "2026.07.22",
                category: "ECOSYSTEM",
                title: "プラネタリー・メッシュにおけるゼロトラスト自己修復アルゴリズム",
                excerpt: "グローバル規模の障害シミュレーションから導き出された、完全自律型ネットワークのレジリエンス構築アプローチ。",
                content: "グローバル規模の障害シミュレーションから導き出された、完全自律型ネットワークのレジリエンス構築アプローチ。\n\n中央集権的な管理者を必要とせず、ノード同士が自律的に異常を検知・隔離し、瞬時にネットワークを自己修復するアルゴリズムの実装詳細。",
                fee: "0.0005 QLUX",
                access: "paid",
                wide: false
            },
            {
                date: "2026.08.14",
                category: "RESEARCH • AI AGENT TRIBE",
                title: "境界なき知性へ、摩擦なき対価を。QLUXがデザインする次世代の決済基盤",
                excerpt: "遅延も、手数料の壁も、国境もない。AIとシステムが自律的に交信し、ナノ単位の価値を瞬時に約定させる。私たちが構築したのは、「数サトシの霊力が、世界の流通構造を根本から書き換える。」",
                content: "遅延も、手数料の壁も、国境もない世界へ。\n\nAIとシステムが自律的に交信し、ナノ単位の価値を瞬時に約定させる。私たちが構築したのは、数サトシの霊力が世界の流通構造を根本から書き換える次世代の決済基盤である。\n\n・完全自動化されたクロスボーダー・ナノペイメント\n・システム・エージェント間の自律的価値交換プロトコル\n・スケーラビリティの限界を突破する分散型台帳の仕組み",
                fee: "0.001 QLUX (Nano-Payment)",
                access: "paid",
                wide: true
            }
        ];

        let currentPost = null;
        const container = document.getElementById('posts-container');
        
        allPosts.forEach((post, index) => {
            const card = document.createElement('div');
            card.className = `post-card ${post.wide ? 'wide' : ''}`;
            card.onclick = () => openModal(index);

            const isFree = post.access === 'free';
            const badgeClass = isFree ? 'badge free' : 'badge';
            const badgeText = isFree ? 'FREE ACCESS' : 'HTTP 402 ENABLED';
            const footerText = isFree ? 'Status: Public Domain' : `Access Fee: ${post.fee}`;
            const btnText = isFree ? 'Read Journal &rarr;' : '⚡ Pay & Unlock Journal';
            const btnClass = isFree ? 'action-btn free-btn' : 'action-btn';

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span>${post.date} // ${post.category}</span>
                        <span class="${badgeClass}">${badgeText}</span>
                    </div>
                    <h2 class="post-title">${post.title}</h2>
                    <p class="post-excerpt">${post.excerpt}</p>
                </div>
                <div class="card-footer">
                    <span class="fee-info">${footerText}</span>
                    <button class="${btnClass}">${btnText}</button>
                </div>
            `;
            container.appendChild(card);
        });

        function openModal(index) {
            currentPost = allPosts[index];
            document.getElementById('modal-meta').innerHTML = `${currentPost.date} // ${currentPost.category}`;
            document.getElementById('modal-title').innerText = currentPost.title;
            document.getElementById('modal-body').innerText = currentPost.content;

            const lockSection = document.getElementById('lock-section');
            const modalBody = document.getElementById('modal-body');

            if (currentPost.access === 'free') {
                lockSection.style.display = 'none';
                modalBody.style.display = 'block';
            } else {
                lockSection.style.display = 'block';
                modalBody.style.display = 'none';
                document.getElementById('locked-desc').innerText = `Access Fee: ${currentPost.fee} - このコンテンツの閲覧にはHTTP 402決済が必要です。`;
                document.getElementById('pay-btn').innerText = '⚡ Pay & Unlock Journal';
                document.getElementById('pay-btn').disabled = false;
            }

            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function executePayment() {
            const btn = document.getElementById('pay-btn');
            const desc = document.getElementById('locked-desc');
            btn.innerText = '🔄 402 Protocol Settling...';
            btn.disabled = true;

            setTimeout(() => {
                desc.innerText = '✅ ナノペイメント成立：アクセス権が認証されました。';
                document.getElementById('lock-section').style.display = 'none';
                document.getElementById('modal-body').style.display = 'block';
            }, 800);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
