<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QLUX Technologies // QLUXpay Engine</title>
  <style>
    :root {
      --bg-main: #010409;
      --bg-card: rgba(13, 20, 32, 0.98);
      --border-accent: rgba(52, 211, 153, 0.4);
      --text-emerald: #34d399;
      --text-gold: #fbbf24;
      --text-cyan: #38bdf8;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: #f8fafc;
      font-family: monospace, sans-serif;
      line-height: 1.6;
      padding-bottom: 60px;
    }

    .hyper-ticker {
      background: #000;
      border-bottom: 1px solid var(--border-accent);
      padding: 8px 20px;
      font-size: 10px;
      color: var(--text-emerald);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .blog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(2, 6, 23, 0.98);
      border-bottom: 1px solid var(--border-accent);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title { font-size: 18px; font-weight: 950; color: #fff; letter-spacing: 1px; }
    .brand-sub { font-size: 9px; background: rgba(52, 211, 153, 0.15); color: var(--text-emerald); padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(52, 211, 153, 0.4); margin-left: 8px; }

    .control-bar {
      background: #020617;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-toggle-auto {
      background: rgba(56, 189, 248, 0.15);
      color: var(--text-cyan);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 10px;
      font-family: monospace;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-toggle-auto.active {
      background: rgba(52, 211, 153, 0.15);
      color: var(--text-emerald);
      border-color: var(--text-emerald);
    }

    .blog-container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
    
    .journal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .card-meta { font-size: 10px; color: var(--text-emerald); margin-bottom: 6px; }
    .card-title { font-size: 16px; color: #fff; font-weight: 900; margin-bottom: 10px; }
    .card-desc { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }

    .quantum-hash-box {
      font-size: 9px;
      color: var(--text-gold);
      background: rgba(251,191,36,0.08);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px dashed rgba(251,191,36,0.3);
      display: flex;
      justify-content: space-between;
    }
    .status-indicator { font-weight: bold; color: var(--text-emerald); }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
    }
    .price-tag { font-size: 11px; color: var(--text-gold); font-weight: bold; }

    .btn-hyper {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      color: #000;
      border: none;
      padding: 10px 18px;
      font-weight: 950;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(1, 4, 9, 0.95);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--text-emerald);
      border-radius: 14px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      color: #cbd5e1;
    }
    .modal-box h3 { color: #fff; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid rgba(52,211,153,0.3); padding-bottom: 8px; display: flex; justify-content: space-between; }
    
    .gateway-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; background: #020617; border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted); padding: 7px 2px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; font-family: monospace; text-align: center;
    }
    .tab-btn.active { background: rgba(52, 211, 153, 0.15); color: var(--text-emerald); border-color: var(--text-emerald); }

    .crypto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .crypto-option {
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-family: monospace;
      color: #fff;
    }
    .crypto-option:hover { border-color: var(--text-emerald); background: rgba(52, 211, 153, 0.1); }
    .crypto-name { font-weight: bold; font-size: 11px; color: var(--text-gold); }
    .crypto-sub { font-size: 8px; color: var(--text-muted); margin-top: 2px; }
    
    .btn-close-modal { width: 100%; background: transparent; border: 1px solid #64748b; color: var(--text-muted); padding: 10px; border-radius: 6px; cursor: pointer; font-size: 11px; margin-top: 10px; }

    .receipt-box {
      background: rgba(52, 211, 153, 0.05);
      border: 1px solid var(--text-emerald);
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <div class="hyper-ticker">
    <div>QLUXpay SYSTEM: <span style="color:var(--text-emerald);">READY</span></div>
    <div>BUILD: 2026.08.16-FINAL</div>
  </div>

  <header class="blog-header">
    <div style="display:flex; align-items:center;">
      <span class="brand-title">QLUX Technologies</span>
      <span class="brand-sub">QLUXpay</span>
    </div>
  </header>

  <!-- 自動更新コントロールバー -->
  <div class="control-bar">
    <span style="font-size:10px; color:var(--text-muted);">オートストリーム制御</span>
    <button id="auto-btn" class="btn-toggle-auto" onclick="toggleAutoStream()">自動更新: OFF</button>
  </div>

  <main class="blog-container">
    <div id="articles-feed">
      <article class="journal-card">
        <div class="card-meta">2026.08.16 // QLUXpay GATEWAY</div>
        <h2 class="card-title">BSV・各種暗号資産および法定通貨によるマルチ決済インボイス</h2>
        <p class="card-desc">ワンタップで選択可能な全決済ルート対応システム。</p>
        <div class="quantum-hash-box">
          <span>TX HASH: <span id="tx-default" class="status-indicator">READY / LISTENING</span></span>
        </div>
        <div class="card-footer">
          <span class="price-tag">150 JPY相当</span>
          <button class="btn-hyper" onclick="openQLUXModal('BSV・各種暗号資産および法定通貨によるマルチ決済インボイス', 'tx-default')">💳 QLUXpay で支払う</button>
        </div>
      </article>
    </div>
  </main>

  <!-- 決済モーダル -->
  <div class="modal-overlay" id="gateway-modal">
    <div class="modal-box">
      <h3>
        <span>QLUXpay MULTI-GATEWAY</span>
        <span style="font-size:10px; color:var(--text-emerald);">SECURE</span>
      </h3>
      
      <div class="gateway-tabs">
        <button class="tab-btn active" id="tab-btn-bsv" onclick="switchTab('bsv')">⚡ BSV/LN</button>
        <button class="tab-btn" id="tab-btn-crypto" onclick="switchTab('crypto')">💎 主要暗号</button>
        <button class="tab-btn" id="tab-btn-fiat" onclick="switchTab('fiat')">💳 法定通貨</button>
        <button class="tab-btn" id="tab-btn-all" onclick="switchTab('all')">🌐 全マルチ</button>
      </div>

      <!-- BSV/LN -->
      <div id="view-bsv">
        <div class="crypto-grid">
          <button class="crypto-option" onclick="executePayment('BSV Direct', '1QLuxPaySovereignAddressXYZ')">
            <div class="crypto-name">⚡ BSV 直送金</div>
            <div class="crypto-sub">Instant On-Chain</div>
          </button>
          <button class="crypto-option" onclick="executePayment('Lightning Network', 'vlisdirect@gmail.com')">
            <div class="crypto-name">⚡ LNURL</div>
            <div class="crypto-sub">vlisdirect@gmail.com</div>
          </button>
        </div>
      </div>

      <!-- 主要暗号 -->
      <div id="view-crypto" style="display: none;">
        <div class="crypto-grid">
          <button class="crypto-option" onclick="executePayment('Bitcoin (BTC)', 'bc1_qluxpay_btc')">
            <div class="crypto-name">₿ Bitcoin (BTC)</div>
            <div class="crypto-sub">SegWit / Native</div>
          </button>
          <button class="crypto-option" onclick="executePayment('USDT (TRC-20)', 'TRC20_qluxpay_usdt')">
            <div class="crypto-name">₮ USDT (TRC-20)</div>
            <div class="crypto-sub">Tron Network</div>
          </button>
          <button class="crypto-option" onclick="executePayment('Ethereum (ETH)', '0x_qluxpay_eth')">
            <div class="crypto-name">Ξ Ethereum (ETH)</div>
            <div class="crypto-sub">Mainnet / L2</div>
          </button>
          <button class="crypto-option" onclick="executePayment('Solana (SOL)', 'SOL_qluxpay_sol')">
            <div class="crypto-name">◎ Solana (SOL)</div>
            <div class="crypto-sub">SPL Token</div>
          </button>
        </div>
      </div>

      <!-- 法定通貨 -->
      <div id="view-fiat" style="display: none;">
        <div class="crypto-grid">
          <button class="crypto-option" onclick="executePayment('Credit Card / Apple Pay', 'FIAT-CARD-GATEWAY')">
            <div class="crypto-name">💳 クレカ / Apple Pay</div>
            <div class="crypto-sub">Instant Convert</div>
          </button>
          <button class="crypto-option" onclick="executePayment('Bank Wire Transfer', 'BANK-WIRE-QLUX')">
            <div class="crypto-name">🏛 銀行振込</div>
            <div class="crypto-sub">Auto-Matching</div>
          </button>
        </div>
      </div>

      <!-- 全マルチ -->
      <div id="view-all" style="display: none;">
        <div class="crypto-grid">
          <button class="crypto-option" onclick="executePayment('Ripple (XRP)', 'r_qluxpay_xrp')">
            <div class="crypto-name">✕ Ripple (XRP)</div>
            <div class="crypto-sub">XRPL Ledger</div>
          </button>
          <button class="crypto-option" onclick="executePayment('Dogecoin (DOGE)', 'D_qluxpay_doge')">
            <div class="crypto-name">Ð Dogecoin (DOGE)</div>
            <div class="crypto-sub">P2P Network</div>
          </button>
          <button class="crypto-option" onclick="executePayment('Cross-Chain Bridge (5000+)', 'BRIDGE-API-ALL')">
            <div class="crypto-name">🌐 5000種+ 全通貨</div>
            <div class="crypto-sub">Automated Routing</div>
          </button>
        </div>
      </div>

      <div id="receipt-box" class="receipt-box">
        <div style="color:var(--text-emerald); font-weight:bold; margin-bottom:2px;">✔ 決済シグナル送信完了</div>
        <div id="receipt-text" style="color:#94a3b8; word-break:break-all;"></div>
      </div>

      <button class="btn-close-modal" onclick="closeQLUXModal()">閉じる</button>
    </div>
  </div>

  <script>
    let activeStatusId = '';
    let activeItemTitle = '';
    let autoInterval = null;
    let isAutoRunning = false;

    // 自動更新ボタンの切り替えロジック
    function toggleAutoStream() {
      const btn = document.getElementById('auto-btn');
      isAutoRunning = !isAutoRunning;
      if (isAutoRunning) {
        btn.innerText = "自動更新: ON";
        btn.classList.add('active');
        autoInterval = setInterval(appendStreamCard, 10000);
      } else {
        btn.innerText = "自動更新: OFF";
        btn.classList.remove('active');
        clearInterval(autoInterval);
      }
    }

    function appendStreamCard() {
      const feed = document.getElementById('articles-feed');
      if (!feed) return;
      const uniqueId = 'tx-' + Math.floor(Math.random() * 90000 + 10000);
      const topics = [
        "QLUXpay クロスチェーン自動インボイス同期ログ",
        "リアルタイム・マイクロペイメント処理ストリーム",
        "Sovereign Ledger マルチアセット清算レコード"
      ];
      const title = topics[Math.floor(Math.random() * topics.length)];

      const card = document.createElement('article');
      card.className = 'journal-card';
      card.innerHTML = `
        <div class="card-meta">2026.08.16 // AUTO-STREAM SYNC</div>
        <h2 class="card-title">${title}</h2>
        <p class="card-desc">マルチ決済基盤によるリアルタイム・トランザクション処理。</p>
        <div class="quantum-hash-box">
          <span>TX HASH: <span id="${uniqueId}" class="status-indicator">READY / LISTENING</span></span>
        </div>
        <div class="card-footer">
          <span class="price-tag">150 JPY相当</span>
          <button class="btn-hyper" onclick="openQLUXModal('${title}', '${uniqueId}')">💳 QLUXpay で支払う</button>
        </div>
      `;
      feed.prepend(card);
    }

    function openQLUXModal(title, statusId) {
      activeItemTitle = title;
      activeStatusId = statusId;
      document.getElementById('receipt-box').style.display = 'none';
      document.getElementById('gateway-modal').style.display = 'flex';
    }

    function closeQLUXModal() {
      document.getElementById('gateway-modal').style.display = 'none';
    }

    function switchTab(mode) {
      ['bsv', 'crypto', 'fiat', 'all'].forEach(m => {
        const b = document.getElementById(`tab-btn-${m}`);
        const v = document.getElementById(`view-${m}`);
        if (b) b.classList.remove('active');
        if (v) v.style.display = 'none';
      });
      document.getElementById(`tab-btn-${mode}`).classList.add('active');
      document.getElementById(`view-${mode}`).style.display = 'block';
    }

    function executePayment(methodName, targetInfo) {
      const receiptBox = document.getElementById('receipt-box');
      const receiptText = document.getElementById('receipt-text');

      receiptBox.style.display = 'block';
      receiptText.innerHTML = `方式: ${methodName}<br>宛先: ${targetInfo}<br>ステータス: 処理中...`;

      setTimeout(() => {
        if (activeStatusId && document.getElementById(activeStatusId)) {
          const target = document.getElementById(activeStatusId);
          target.innerText = "SUCCESS (PAID)";
          target.style.color = "var(--text-emerald)";
        }
        receiptText.innerHTML = `✔ 「${activeItemTitle}」の決済が正常に反映されました。`;
      }, 1000);
    }
  </script>
</body>
</html>
