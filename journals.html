<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Journals // Sovereign Node</title>
    <style>
        :root {
            --bg-color: #030504;
            --card-bg: #080d0a;
            --border-color: #122218;
            --accent-green: #38bdf8;
            --text-main: #f4f4f1;
            --text-muted: #7a8c82;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .post-card:hover {
            border-color: var(--accent-green);
        }
        .post-date {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .post-title {
            color: var(--accent-green);
            margin-top: 0;
        }
        .read-more {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent-green);
            font-size: 0.9rem;
            text-decoration: none;
        }
        /* モーダル（詳細閲覧用） */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 4, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QLUX Journals</h1>
        <div id="posts-container">Loading journals...</div>
    </div>

    <!-- 記事詳細モーダル -->
    <div id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModalDirect()">&times;</button>
            <div id="modal-date" class="post-date"></div>
            <h2 id="modal-title" class="post-title"></h2>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
            <p id="modal-body" style="line-height: 1.6; color: var(--text-main);"></p>
        </div>
    </div>

    <script>
        let allPosts = [];

        fetch('posts.json')
            .then(response => response.json())
            .then(posts => {
                allPosts = posts;
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                posts.forEach((post, index) => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.onclick = () => openModal(index);
                    card.innerHTML = `
                        <div class="post-date">${post.date}</div>
                        <h2 class="post-title">${post.title}</h2>
                        <p>${post.excerpt}</p>
                        <span class="read-more">Read Full Article &rarr;</span>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('posts-container').innerHTML = 'Failed to load journals.';
            });

        function openModal(index) {
            const post = allPosts[index];
            document.getElementById('modal-date').innerText = post.date;
            document.getElementById('modal-title').innerText = post.title;
            document.getElementById('modal-body').innerText = post.content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal(event) {
            document.getElementById('modal').style.display = 'none';
        }

        function closeModalDirect() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
