<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Journals // Sovereign Mesh</title>
    <style>
        :root {
            --bg-color: #030504;
            --card-bg: #080d0a;
            --border-color: #122218;
            --accent-green: #38bdf8;
            --text-main: #f4f4f1;
            --text-muted: #7a8c82;
            --badge-bg: #0c1a12;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .engine-status {
            background: #081510;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            color: var(--accent-green);
            font-size: 0.7rem;
        }
        .section-tag {
            font-size: 0.75rem;
            color: var(--accent-green);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 35px;
        }
        
        /* 非対称レイアウトグリッド */
        .journals-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media(min-width: 768px) {
            .journals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .post-card.wide {
                grid-column: span 2;
            }
        }

        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .post-card:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
        }
        .badge.free {
            color: var(--text-muted);
        }
        .post-title {
            color: var(--text-main);
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            font-weight: bold;
            line-height: 1.4;
        }
        .post-excerpt {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 0.8rem;
            margin-top: auto;
        }
        .fee-info {
            color: var(--text-muted);
        }
        .action-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btn.free-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        /* モーダル */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 4, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            max-width: 750px;
            width: 100%;
            padding: 35px;
            box-sizing: border-box;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }
        #modal-meta {
            font-size: 0.75rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        #modal-title {
            color: var(--text-main);
            font-size: 1.6rem;
            margin: 0 0 15px 0;
        }
        #modal-body {
            font-size: 1rem;
            color: var(--text-main);
            line-height: 1.8;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <span>QLUX // SOVEREIGN MESH</span>
            <span class="engine-status">⚡ HTTP 402 NANO-SETTLEMENT ENGINE: ACTIVE</span>
        </div>

        <div class="section-tag">Research & Deep Insights</div>
        <h1>QLUX Journals</h1>
        <div class="subtitle">ここから先は、QLUXが定義する領域だ。QLUXは、すべての限界を過去にする。</div>
        
        <div id="posts-container" class="journals-grid">Loading journals...</div>
    </div>

    <!-- モーダル -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-meta"></div>
            <h2 id="modal-title"></h2>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
            <p id="modal-body"></p>
        </div>
    </div>

    <script>
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(posts => {
                allPosts = posts;
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                
                posts.forEach((post, index) => {
                    const card = document.createElement('div');
                    card.className = `post-card ${post.wide ? 'wide' : ''}`;
                    card.onclick = () => openModal(index);

                    const isFree = post.access === 'free';
                    const badgeClass = isFree ? 'badge free' : 'badge';
                    const badgeText = isFree ? 'FREE ACCESS' : 'HTTP 402 ENABLED';
                    const footerText = isFree ? 'Status: Public Domain' : `Access Fee: ${post.fee || '0.001 QLUX'}`;
                    const btnText = isFree ? 'Read Journal &rarr;' : '⚡ Pay & Unlock Journal';
                    const btnClass = isFree ? 'action-btn free-btn' : 'action-btn';

                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span>${post.date} // ${post.category || 'ARCHIVE'}</span>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                            <h2 class="post-title">${post.title}</h2>
                            <p class="post-excerpt">${post.excerpt}</p>
                        </div>
                        <div class="card-footer">
                            <span class="fee-info">${footerText}</span>
                            <button class="${btnClass}">${btnText}</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('posts-container').innerHTML = '<p style="color: var(--text-muted);">Failed to load journals.</p>';
            });

        function openModal(index) {
            const post = allPosts[index];
            document.getElementById('modal-meta').innerHTML = `${post.date} // ${post.category || 'JOURNAL'}`;
            document.getElementById('modal-title').innerText = post.title;
            document.getElementById('modal-body').innerText = post.content;
            document.getElementById('modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
