<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Journals // Sovereign Mesh</title>
    <style>
        :root {
            --bg-color: #030504;
            --card-bg: #080d0a;
            --border-color: #122218;
            --accent-green: #38bdf8;
            --text-main: #f4f4f1;
            --text-muted: #7a8c82;
            --badge-bg: #0c1a12;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header-top {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .post-card:hover {
            border-color: var(--accent-green);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge {
            background: var(--badge-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .post-title {
            color: var(--text-main);
            font-size: 1.4rem;
            margin: 0 0 10px 0;
        }
        .post-excerpt {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 0.85rem;
        }
        .action-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
        }
        /* モーダル */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 4, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-green);
            border-radius: 8px;
            max-width: 700px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">RESEARCH & DEEP INSIGHTS</div>
        <h1>QLUX Journals</h1>
        <div class="subtitle">ここから先は、QLUXが定義する領域だ。QLUXは、すべての限界を過去にする。</div>
        
        <div id="posts-container">Loading journals...</div>
    </div>

    <!-- 詳細閲覧モーダル -->
    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modal-meta" class="card-header" style="margin-bottom: 5px;"></div>
            <h2 id="modal-title" class="post-title" style="color: var(--accent-green); margin-bottom: 15px;"></h2>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
            <p id="modal-body" style="line-height: 1.7; color: var(--text-main); white-space: pre-line;"></p>
        </div>
    </div>

    <script>
        let allPosts = [];

        fetch('posts.json')
            .then(res => res.json())
            .then(posts => {
                allPosts = posts;
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                posts.forEach((post, index) => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.onclick = () => openModal(index);
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <span>${post.date} // ARCHIVE</span>
                            <span class="badge">HTTP 402 ENABLED</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-excerpt">${post.excerpt}</p>
                        <div class="card-footer">
                            <span style="color: var(--text-muted);">Access: Public Domain</span>
                            <button class="action-btn">Read Full Article &rarr;</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('posts-container').innerHTML = '<p style="color: var(--text-muted);">Failed to load journals.</p>';
            });

        function openModal(index) {
            const post = allPosts[index];
            document.getElementById('modal-meta').innerHTML = `<span>${post.date} // JOURNAL</span><span class="badge">SECURE NODE</span>`;
            document.getElementById('modal-title').innerText = post.title;
            document.getElementById('modal-body').innerText = post.content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
