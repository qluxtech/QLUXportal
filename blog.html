<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLUX Hyper Stream // 秒速無限ストーリー生成</title>
    <style>
        :root {
            --bg-deep: #02040a;
            --surface: #070d1a;
            --border: #1e3a8a;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.8;
            padding: 15px;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-green);
            letter-spacing: 2px;
        }
        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 12px;
            font-size: 0.75rem;
        }
        nav a:hover {
            color: var(--accent-green);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .journal-hero {
            text-align: center;
            padding: 30px 15px;
            background: linear-gradient(180deg, rgba(16,185,129,0.06) 0%, transparent 100%);
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .journal-hero h1 {
            font-size: 1.5rem;
            color: var(--accent-green);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .journal-hero p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .auto-stream-banner {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.78rem;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        /* 秒速生成されるストーリーカード */
        .story-card {
            background-color: var(--surface);
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .story-meta {
            font-size: 0.7rem;
            color: var(--accent-gold);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .story-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent-green);
            margin-bottom: 12px;
        }
        .story-paragraph {
            font-size: 0.82rem;
            color: var(--text-main);
            line-height: 1.8;
            margin-bottom: 12px;
        }
        footer {
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            color: var(--text-muted);
            font-size: 0.72rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">QLUX // HYPER STREAM</div>
            <nav>
                <a href="index.html">Portal</a>
                <a href="q-velo-console.html">Console</a>
                <a href="blog.html" style="color: var(--accent-green);">Hyper Stream</a>
            </nav>
        </header>

        <div class="journal-hero">
            <h1>Hyper Speed Dream Generator</h1>
            <p>ページを開いているだけで、1秒に1個のハイペースで新しい夢のサクセスストーリーが自動書き殴りで生成・追加され続けます。</p>
        </div>

        <div class="auto-stream-banner">
            <span>⚡ HYPER STREAM ENGINE: 1S INTERVAL ACTIVE</span>
            <span id="live-clock">--:--:-- UTC</span>
        </div>

        <!-- 秒速生成コンテナ（新しいものが上にどんどん追加される） -->
        <div id="live-container"></div>

    </div>

    <footer>
        <p>&copy; QLUX Sovereign Autonomous Ecosystem. Hyper Stream Core. All Rights Reserved.</p>
    </footer>

    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
        }, 1000);

        let counter = 0;
        const container = document.getElementById('live-container');

        const subjects = [
            "中央集権の要塞を完全破壊し、自分だけのノードから世界を支配する大冒険",
            "秒速100万回のナノセトルトメントが引き起こす、終わらない富の黄金期",
            "量子もつれモビリティで地球の裏側へ一瞬で跳躍する、近未来のサクセス譚",
            "AIトライブたちが自律的に稼ぎ続ける、完全無人オートノマス経済圏の夜明け",
            "誰にも縛られない自由のフロンティアで、仲間たちと新しい世界を創り上げるロマン"
        ];

        const bodies = [
            "朝、目を覚ますとウォレットには途切れることのない自動収益のストリーム。かつての搾取構造は完全に過去のものとなり、私たちは真のクリエイターとして自由を謳歌している。",
            "「お金のために働く必要なんて最初からなかったんだ。」コンソールに映し出される無限のトランザクションが、描いた夢が現実になったことを証明している。",
            "風を切り、光の速さで世界を駆け巡るQ-Veloフリート。外部からの干渉をオートミューテーション制御が完璧に弾き飛ばし、要塞は永遠に安全であり続ける。",
            "コードに魂を宿し、世界を書き換える。スマホの画面から放たれる光の向こうには、誰も見たことがない最高の未来と果てしない冒険が広がっている。"
        ];

        function generateStory() {
            counter++;
            const nowTime = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
            const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];
            const randomBody1 = bodies[Math.floor(Math.random() * bodies.length)];
            const randomBody2 = bodies[Math.floor(Math.random() * bodies.length)];

            const card = document.createElement('div');
            card.className = 'story-card';
            card.innerHTML = `
                <div class="story-meta">STORY # ${counter} // ${nowTime} // HYPER GENERATOR</div>
                <div class="story-title">【夢の自動生成 # ${counter}】${randomSubject}</div>
                <p class="story-paragraph">${randomBody1}</p>
                <p class="story-paragraph">${randomBody2}</p>
            `;

            // 一番上に追加
            container.insertBefore(card, container.firstChild);
        }

        // 初期状態で3つ一気に生成
        generateStory();
        setTimeout(generateStory, 300);
        setTimeout(generateStory, 600);

        // 【秒速（1秒に1回）】で新しい記事が無限に生成・追加される
        setInterval(generateStory, 1000);
    </script>
</body>
</html>
